{% extends 'index.html' %}

{% block content %}
  <main class="main">
    <section class="bg-brand-100">
      <div class="container py-5">
        <h1 class="text-center">Profile</h1>
      </div>
    </section>

    <section class="bg-brand-50 py-5">
      <div class="container-sm">
        <div class="row">
          <div class="d-flex justify-content-between align-items-center py-2">
            <p class="m-0">Update your profile information</p>
            {% if user.is_authenticated and profile.is_published %}
                <a href="{% url user.user_type profile.id %}" class="btn btn-primary">View Profile</a>
            {% else %}
                <button class="btn btn-primary" aria-disabled="true" disabled>Publish to View</button>
            {% endif %}
          </div>
          {% include 'partials/forms/form.html' %}
        </div>
      </div>
    </section>
  </main>
{% endblock %}
